name: Update profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: '23 0 * * *'
  push:
    paths:
      - 'scripts/update_stats.py'
      - '.github/workflows/profile-stats.yml'

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Build stats from public GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: AnkjoD
        run: python3 scripts/update_stats.py
      - name: Save updated card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update public profile stats'
            git push
          fi
